name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate GitHub stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=curdal&show_icons=true&hide_title=true&count_private=true&hide_border=true&bg_color=00000000&title_color=4d8200&icon_color=4d8200&ring_color=4d8200&text_color=171717
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate GitHub stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=curdal&show_icons=true&hide_title=true&count_private=true&theme=dark&hide_border=true&bg_color=00000000&title_color=89CA1D&icon_color=89CA1D&ring_color=89CA1D&text_color=f5f5f5
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate WakaTime stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=curdal9201&layout=compact&langs_count=6&hide_border=true&bg_color=00000000&title_color=4d8200&icon_color=4d8200&text_color=171717
          path: profile/wakatime-light.svg
          fail_on_error: true

      - name: Generate WakaTime stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=curdal9201&layout=compact&langs_count=6&theme=dark&hide_border=true&bg_color=00000000&title_color=89CA1D&icon_color=89CA1D&text_color=f5f5f5
          path: profile/wakatime-dark.svg
          fail_on_error: true

      - name: Generate Top Languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=curdal&layout=compact&langs_count=6&card_width=320&custom_title=Preferred%20Toolkit&hide_border=true&bg_color=00000000&title_color=4d8200&icon_color=4d8200&text_color=171717
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=curdal&layout=compact&langs_count=6&card_width=320&custom_title=Preferred%20Toolkit&theme=dark&hide_border=true&bg_color=00000000&title_color=89CA1D&icon_color=89CA1D&text_color=f5f5f5
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || (git commit -m "chore: update README stats cards" && git push)

name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=curdal&show_icons=true&hide_title=true
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate GitHub stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=curdal&show_icons=true&hide_title=true&theme=dark
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate WakaTime stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=curdal9201&layout=compact&langs_count=6
          path: profile/wakatime-light.svg
          fail_on_error: true

      - name: Generate WakaTime stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=curdal9201&layout=compact&langs_count=6&theme=dark
          path: profile/wakatime-dark.svg
          fail_on_error: true

      - name: Generate Top Languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=curdal&layout=compact&langs_count=6&card_width=320&custom_title=Preferred%20Toolkit
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=curdal&layout=compact&langs_count=6&card_width=320&custom_title=Preferred%20Toolkit&theme=dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || (git commit -m "chore: update README stats cards" && git push)
